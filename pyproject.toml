[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule2input"
version = "0.2.0"
description = "From a drawn molecule to a quantum-chemistry input file"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rdkit>=2022.9",
    "numpy>=1.23",
    "pillow>=9",
    "pyyaml>=6",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "itsdangerous>=2.1"]
gui = ["streamlit>=1.30"]
crystal = ["gemmi>=0.6"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
m2i = "m2i.cli:main"

[tool.setuptools.packages.find]
include = ["m2i*"]

[tool.setuptools.package-data]
m2i = ["profiles/*.yaml", "gui/viewer/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
